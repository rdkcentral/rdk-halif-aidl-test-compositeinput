compositeinput:
  description: "COMPOSITEINPUT L1, L2 and L3 test setup"
  restart_required: False
  test_suites:
    - name: "VTS_L1_COMPOSITEINPUT"
      test_cases:
        - "getPortIds_pos"
        - "getPort_pos"
        - "getPort_neg"
        - "getPlatformCapabilities_pos"
        - "getPortInfo_pos"
        - "getId_pos"
        - "getCapabilities_pos"
        - "getState_initial"
        - "getStatus_pos"
        - "open_close_pos"
        - "open_close_neg"
        - "registerunregisterEventListener_pos"
        - "unregisterEventListener_neg"
        - "controller_start_stop_pos"
        - "controller_start_stop_neg"
        - "getProperty_pos"
        - "getProperty_neg"
        - "getPropertyMulti_pos"
        - "getPropertyMulti_neg"
        - "resetMetrics_pos"
        - "setProperty_pos"
        - "setProperty_neg"
        - "setPropertyMulti_pos"
        - "setPropertyMulti_neg"
    - name: "VTS_L2_COMPOSITEINPUT"
      test_cases:
        - "StateTransitions"
        - "ConnectionState"
        - "PropertySetGetStarted"
        - "PropertyMultiSetGetStarted"
        - "ResetMetrics"
        - "MaximumConcurrentStartedPorts"
    - name: "VTS_L3_COMPOSITEINPUT"
      test_cases:
        - "ConnectionTestBeforeStart"
        - "ConnectionTestAfterStart"
        - "VideoModeDetection"
