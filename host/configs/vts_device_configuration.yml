# The information defined in this config is consistent across all devices of a type.

deviceConfig:
    cpe1:
        platform:   "vDevice"
        model:      "VTV"
        soc_vendor: "intel"
        target_directory: "/home/root/thanu/"
        compositeinput_process_name: "Vendor-CompositeInput"
        prompt: "~#" # Prompt string on console
        test:
            profile: "../../profiles/hfp-compositeinput.yaml" #HFP profile used to meet platform requirements
