compositeinput:
    description: "composite input testing profile / menu system for UT"
    test:
        artifacts:
        #List of artifacts folders, test class copies the content of folder to the target device workspace
          - "../../build/bin/vts-CompositeInput.tar.gz"
        # execute command, this will be appended with the target device workspace path
        execute: "./run.sh"
        type: UT-C # C (UT-C Cunit) / C++ (UT-G (g++ ut-core gtest backend))
        suites:
            0:
                name: "VTS_L1_COMPOSITEINPUT"
                tests:
                    - "getPortIds_pos"
                    - "getPort_pos"
                    - "getPort_neg"
                    - "getPlatformCapabilities_pos"
                    - "getPortInfo_pos"
                    - "getId_pos"
                    - "getCapabilities_pos"
                    - "getState_initial"
                    - "getStatus_pos"
                    - "open_pos"
                    - "close_pos"
                    - "open_neg"
                    - "close_neg"
                    - "registerEventListener_pos"
                    - "unregisterEventListener_pos"
                    - "unregisterEventListener_neg"
                    - "controller_start_pos"
                    - "controller_stop_pos"
                    - "controller_start_neg"
                    - "controller_stop_neg"
                    - "getProperty_pos"
                    - "getProperty_neg"
                    - "getPropertyMulti_pos"
                    - "getPropertyMulti_neg"
                    - "resetMetrics_pos"
                    - "setProperty_pos"
                    - "setProperty_neg"
                    - "setPropertyMulti_pos"
                    - "setPropertyMulti_neg"
            1:
                name: "VTS_L2_COMPOSITEINPUT"
                tests:
                    - "StateTransitions"
                    - "ConnectionState"
                    - "PropertySetGetStarted"
                    - "PropertyMultiSetGetStarted"
                    - "ResetMetrics"
                    - "MaximumConcurrentStartedPorts"
            2:
                name: "VTS_L3_COMPOSITEINPUT"
                tests:
                    - "ConnectionTestBeforeStart"
                    - "ConnectionTestAfterStart"
                    - "VideoModeDetection"